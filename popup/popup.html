<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tube Manager</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-color: #FFFFFF;
      --text-muted: rgba(255, 255, 255, 0.6);
      --accent-color: #E63946;
      --accent-gradient: linear-gradient(135deg, #E63946, #D62246);
      --success-color: #38B000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .logo {
      background: var(--accent-gradient);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(230, 57, 70, 0.3);
    }

    .logo svg {
      width: 18px;
      height: 18px;
      fill: #FFFFFF;
    }

    .title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .status-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .status-title {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-value {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--text-muted);
      display: inline-block;
    }

    .status-dot.syncing {
      background-color: #FFB703;
      box-shadow: 0 0 8px #FFB703;
      animation: pulse 1.5s infinite;
    }

    .status-dot.completed {
      background-color: var(--success-color);
      box-shadow: 0 0 8px var(--success-color);
    }

    .status-dot.failed {
      background-color: var(--accent-color);
      box-shadow: 0 0 8px var(--accent-color);
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
      margin-top: 12px;
      overflow: hidden;
      display: none;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent-gradient);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
      display: none;
      text-align: right;
    }

    .info-box {
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.01);
      border-radius: 8px;
      padding: 10px;
      border-left: 3px solid var(--accent-color);
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
      </svg>
    </div>
    <h1 class="title">Tube Manager</h1>
  </div>

  <div class="status-card">
    <div class="status-title">현재 동기화 상태</div>
    <div class="status-value">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">대기 중</span>
    </div>
    <div class="progress-bar-container" id="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="progress-text" id="progress-text">0/0 완료</div>
  </div>

  <div class="info-box">
    유튜브 홈 페이지 상단의 <strong>'유령 채널 청소'</strong> 버튼을 클릭하면 대화면의 전체 분석 대시보드가 로드됩니다.
  </div>

  <script src="popup.js"></script>
</body>
</html>
